services:
  - type: web
    name: hazely
    runtime: node
    plan: starter            # 0.5 CPU, 512 MB
    buildCommand: "true"     # залежностей немає
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_PATH
        value: /var/data/hazely.db
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
    disk:
      name: hazely-data
      mountPath: /var/data
      sizeGB: 1
